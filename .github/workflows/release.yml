name: Release

# Push a tag like v0.2.0 to build Insomnia.app for arm64 and x86_64 and publish
# a GitHub release. install.sh downloads the assets from the latest release.
# Running it by hand (workflow_dispatch) checks and builds but doesn't publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Build and package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/package-release.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes
