name: Release

# Push a tag like v0.2.0 to build Insomnia.app for arm64 and x86_64 and publish
# a GitHub release. install.sh downloads the assets from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes
